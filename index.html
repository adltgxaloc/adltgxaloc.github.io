<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLA CSS</title>
    <link rel="stylesheet" href="estilostable.css">
</head>
<body>
    <table>
        <thead>
            <th>Campo1</th>
            <th>Campo2</th>
            <th>Campo3</th>
        </thead>
        <tbody>
            <tr>
                <td>Prueba1a</td>
                <td>Prueba1b</td>
                <td>Prueba1c</td>
            </tr>
            <tr>
                <td>Prueba2a</td>
                <td>Prueba2b</td>
                <td>Prueba2c</td>
            </tr>
            <tr>
                <td>Prueba3a</td>
                <td>Prueba3b</td>
                <td>Prueba3c</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3" class="mipie">Este es un ejemplo de una tabla</td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
